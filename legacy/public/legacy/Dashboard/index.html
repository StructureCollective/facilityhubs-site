<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legacy Property Hub | Dashboard</title>
<link rel="icon" type="image/png" href="/assets/facility-hubs-favicon.png">
<meta name="theme-color" content="#0d2b5c">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div id="loadingMsg" class="loading">Loading&hellip;</div>
<div id="app" class="shell" hidden>
<aside>
<div class="brand">
<img src="/assets/legacy-logo.png" alt="Legacy Property Hub">
<small>LEGACY PROPERTY HUB</small>
</div>
<nav>
<a class="active" aria-current="page">Dashboard</a>
<a href="../Admin/">Admin</a>
<a href="/"><span>All Hubs</span></a>
</nav>
</aside>
<main>
<header class="page-header">
<h1 id="greeting">Your rent</h1>
<p id="unitLabel"></p>
</header>

<div id="apiNotice" class="notice error" hidden></div>

<section class="cards">
<div class="card">
<div class="label">Rent amount</div>
<div class="value" id="rentAmount">&mdash;</div>
</div>
<div class="card">
<div class="label">Next due date</div>
<div class="value" id="dueDate">&mdash;</div>
<div class="sub" id="dueSub"></div>
</div>
<div class="card">
<div class="label">Pay now</div>
<div style="margin-top:10px;">
<button class="btn gold" id="payBtn">Pay rent</button>
</div>
<div class="sub" id="payStatus"></div>
</div>
</section>

<section>
<h2 style="margin-bottom:12px;">Payment history</h2>
<table>
<thead><tr><th>Period</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
<tbody id="historyBody"><tr><td colspan="4">Loading&hellip;</td></tr></tbody>
</table>
</section>
</main>
</div>

<div id="picker" class="loading" hidden>
<p>No tenant selected. Pick one to preview their dashboard:</p>
<ul id="pickerList" style="list-style:none;padding:0;"></ul>
</div>

<script src="app.js"></script>
</body>
</html>
