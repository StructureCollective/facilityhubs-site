<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legacy Property Hub | Dashboard</title>
<link rel="icon" type="image/png" href="/assets/facility-hubs-favicon.png">
<meta name="theme-color" content="#0d2b5c">
<link rel="stylesheet" href="../style.css">
<style>
.hero {
  background: linear-gradient(135deg, var(--navy), var(--navy-dark));
  color: #fff; border-radius: 16px; padding: 28px 32px; margin-bottom: 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap;
}
.hero .label { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; opacity: .7; font-weight: 700; }
.hero .amount { font-family: var(--font-head); font-size: 2.6rem; margin: 6px 0 4px; }
.hero .due { font-size: .88rem; opacity: .85; }
.hero .btn.gold { flex-shrink: 0; }
.mini-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
</style>
</head>
<body>
<div id="loadingMsg" class="loading">Loading&hellip;</div>

<div id="app" hidden>
<div class="topbar">
<img src="/assets/legacy-logo.png" alt="Legacy Property Hub">
</div>
<div class="shell">
<aside>
<div class="greeting">
<p class="hi" id="greeting">Hi</p>
<p class="sub" id="unitLabel"></p>
</div>
<nav>
<a class="active" aria-current="page">Dashboard</a>
<a href="../Maintenance/">Maintenance Requests</a>
<a href="../Payments/">Payments</a>
<a href="../Documents/">Documents</a>
<div class="divider"></div>
<a href="/legacy/">Sign Out</a>
</nav>
</aside>
<main>
<div id="apiNotice" class="notice error" hidden></div>

<div class="hero">
<div>
<div class="label">Amount due</div>
<div class="amount" id="rentAmount">&mdash;</div>
<div class="due">Due <span id="dueDate">&mdash;</span><span id="lateNote"></span></div>
</div>
<a class="btn gold" href="../Payments/" id="payLink">Pay now</a>
</div>

<section class="mini-row">
<div class="card">
<div class="label">Open maintenance requests</div>
<div class="value" id="openCount">&mdash;</div>
<div class="sub"><a href="../Maintenance/">Request maintenance &rarr;</a></div>
</div>
<div class="card">
<div class="label">Last payment</div>
<div class="value" id="lastPayment">&mdash;</div>
<div class="sub"><a href="../Payments/">View payment history &rarr;</a></div>
</div>
</section>
</main>
</div>
<footer class="app-footer">
<a class="built-by" href="https://structurecollective.com" target="_blank" rel="noopener">
<img src="/assets/structure-collective-icon.png" alt="" width="16" height="16">
Built by Structure Collective
</a>
</footer>
</div>

<div id="picker" class="loading" hidden>
<p>No tenant selected. Pick one to preview their dashboard:</p>
<ul id="pickerList" style="list-style:none;padding:0;"></ul>
</div>

<script src="app.js"></script>
</body>
</html>
