<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legacy Property Hub | Admin</title>
<link rel="icon" type="image/png" href="/assets/facility-hubs-favicon.png">
<meta name="theme-color" content="#0d2b5c">
<link rel="stylesheet" href="../style.css">
<style>
  .row-click { cursor: pointer; }
  .row-click:hover { background: var(--bg); }
  #tenantDetail { display: none; }
  #tenantDetail.open { display: block; }
  .backlink { display: inline-block; margin-bottom: 14px; font-size: .84rem; color: var(--navy); cursor: pointer; font-weight: 700; }
  .detail-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .detail-tabs button {
    background: #fff; border: 1px solid var(--line-strong); border-radius: 999px; padding: 8px 16px;
    font-size: .82rem; font-weight: 700; color: var(--muted); cursor: pointer;
  }
  .detail-tabs button.active { background: var(--navy); color: #fff; border-color: var(--navy); }
</style>
</head>
<body>
<div id="app" class="topbar-shell">
<div class="topbar">
<img src="/assets/legacy-logo.png" alt="Legacy Property Hub">
<span class="word">LEGACY PROPERTY HUB</span>
</div>
<div class="shell">
<aside>
<div class="greeting">
<p class="hi">Admin</p>
<p class="sub">Property Hub</p>
</div>
<nav>
<a class="active" aria-current="page">Tenants</a>
<div class="divider"></div>
<a href="/">All Hubs</a>
</nav>
</aside>
<main>
<div id="tenantList">
<header class="page-header">
<h1>Tenants</h1>
<p>Rent, due dates, and payment status across all tenants.</p>
</header>
<div id="apiNotice" class="notice error" hidden></div>
<table>
<thead><tr><th>Tenant</th><th>Address</th><th>Rent</th><th>Next due</th><th>Last paid</th></tr></thead>
<tbody id="tenantBody"><tr><td colspan="5">Loading&hellip;</td></tr></tbody>
</table>
</div>

<div id="tenantDetail">
<span class="backlink" id="backLink">&larr; All tenants</span>
<header class="page-header">
<h1 id="detailName">&nbsp;</h1>
<p id="detailUnit"></p>
</header>
<div class="detail-tabs">
<button class="active" id="tabPayments">Payments</button>
<button id="tabMaintenance">Maintenance Requests</button>
</div>
<table id="paymentsTable">
<thead><tr><th>Period</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
<tbody id="detailBody"><tr><td colspan="4">Loading&hellip;</td></tr></tbody>
</table>
<table id="maintenanceTable" hidden>
<thead><tr><th>Description</th><th>Status</th><th>Submitted</th></tr></thead>
<tbody id="maintenanceBody"><tr><td colspan="3">Loading&hellip;</td></tr></tbody>
</table>
</div>
</main>
</div>
</div>

<script src="app.js"></script>
</body>
</html>
