<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legacy Property Hub</title>
<meta name="description" content="Property with Purpose. Value for Generations.">
<link rel="canonical" href="https://facilityhubs.com/legacy/">
<link rel="icon" type="image/png" href="/assets/facility-hubs-favicon.png">
<meta name="theme-color" content="#f4f5f7">

<!-- Link preview tags -- these are what iMessage, SMS/RCS, Slack, and
     social apps read to build a preview card when this URL is shared.
     Without them most apps fall back to a bare link with no image. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Legacy Property Hub">
<meta property="og:title" content="Legacy Property Hub">
<meta property="og:description" content="Property with Purpose. Value for Generations.">
<meta property="og:url" content="https://facilityhubs.com/legacy/">
<meta property="og:image" content="https://facilityhubs.com/assets/legacy-og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Legacy Property Hub">
<meta name="twitter:description" content="Property with Purpose. Value for Generations.">
<meta name="twitter:image" content="https://facilityhubs.com/assets/legacy-og-image.png">
<style>
  :root {
    --navy: #0d2b5c;
    --gold: #a9782c;
    --gold-light: #c99b4a;
    --ink: #12192b;
    --muted: #5b6478;
    --line: #d7dbe3;
    --font-head: Georgia, 'Times New Roman', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #f7f8fa 0%, #eceef2 100%);
    font-family: var(--font-body);
    color: var(--ink);
    padding: 40px 24px;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 24px 60px rgba(13, 27, 58, .10);
    padding: 48px 40px 36px;
    text-align: center;
  }
  .logo { height: 140px; margin: 0 auto 22px; display: block; }
  h1 {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 1.7rem;
    margin: 0 0 10px;
    color: var(--navy);
  }
  .slogan {
    font-family: var(--font-head);
    font-style: italic;
    color: var(--muted);
    font-size: 1rem;
    margin: 0 0 34px;
    line-height: 1.5;
  }
  .actions { display: flex; flex-direction: column; gap: 12px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border-radius: 999px; padding: 14px 24px; font-weight: 700; font-size: .95rem;
    text-decoration: none; border: none; cursor: pointer; font-family: inherit;
  }
  .btn.primary { background: var(--navy); color: #fff; }
  .btn.primary:hover { background: #081c3f; }
  .btn.primary:disabled { background: #9aa5bd; cursor: default; }
  .btn.secondary { background: #fff; color: var(--navy); border: 1.5px solid var(--line); }
  .btn.secondary:hover { border-color: var(--navy); }
  .field {
    text-align: left;
    margin-bottom: 14px;
  }
  .field label {
    display: block;
    font-size: .8rem;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 13px 16px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    font-size: .95rem;
    font-family: inherit;
    color: var(--ink);
  }
  .field input:focus {
    outline: none;
    border-color: var(--navy);
  }
  .notice {
    text-align: left;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: .85rem;
    margin-bottom: 16px;
    line-height: 1.45;
  }
  .notice.success { background: #eef7ef; color: #2a6b39; border: 1px solid #cfe8d3; }
  .notice.error { background: #fdeeee; color: #9a2f2f; border: 1px solid #f3cccc; }
  .sent-icon {
    width: 48px; height: 48px; margin: 0 auto 14px; display: block;
    border-radius: 50%; background: #eef7ef; color: #2a6b39;
    align-items: center; justify-content: center; font-size: 1.4rem;
  }
  footer {
    margin-top: 32px;
    font-size: .76rem;
    color: #8b95ab;
  }
  .built-by {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #8b95ab;
    font-size: .78rem;
    font-weight: 600;
    text-decoration: none;
  }
  .built-by img { display: block; border-radius: 3px; }
  .built-by:hover { color: var(--navy); text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/assets/legacy-logo.png" alt="Legacy Property Hub">
    <h1>Legacy Property Hub</h1>
    <p class="slogan">Property with Purpose.<br>Value for Generations.</p>

    <div id="errorNotice" class="notice error" hidden></div>

    <div id="signinView">
      <form id="emailForm" class="actions" novalidate>
        <div class="field">
          <label for="emailInput">Email address</label>
          <input type="email" id="emailInput" name="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <button type="submit" class="btn primary" id="submitBtn">Send Sign-In Link</button>
        <a class="btn secondary" href="mailto:legacy@facilityhubs.com">Contact Us</a>
      </form>
    </div>

    <div id="sentView" hidden>
      <div class="notice success">
        <strong>Check your email.</strong> If that address is on file, we've sent a one-time sign-in link. It expires in 15 minutes.
      </div>
      <div class="actions">
        <a class="btn secondary" href="mailto:legacy@facilityhubs.com">Contact Us</a>
      </div>
    </div>
  </div>

  <footer>
    <a class="built-by" href="https://structurecollective.com" target="_blank" rel="noopener">
      <img src="/assets/structure-collective-icon.png" alt="" width="16" height="16">
      Built by Structure Collective
    </a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
