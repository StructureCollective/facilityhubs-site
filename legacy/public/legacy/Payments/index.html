<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legacy Property Hub | Payments</title>
<link rel="icon" type="image/png" href="/assets/facility-hubs-favicon.png">
<meta name="theme-color" content="#0d2b5c">
<link rel="stylesheet" href="../style.css">
<style>
  /* This tile is the interim "pay rent" flow -- it calls Stripe
     Checkout directly. When the custom-built Stripe payment page
     exists, swap payBtn's click handler (in app.js) to navigate there
     instead of calling /legacy/api/tenants/:id/pay itself. */
  .pay-hero {
    background: linear-gradient(135deg, var(--navy), var(--navy-dark));
    color: #fff; border-radius: 16px; padding: 28px 32px; margin-bottom: 28px;
    display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap;
  }
  .pay-hero .label { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; opacity: .7; font-weight: 700; }
  .pay-hero .amount { font-family: var(--font-head); font-size: 2.6rem; margin: 6px 0 4px; }
  .pay-hero .due { font-size: .88rem; opacity: .85; }
  .pay-hero .pay-actions { text-align: right; }
  .pay-hero .sub { color: rgba(255,255,255,.85); margin-top: 8px; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar input[type="text"], .toolbar select { width: auto; }
  .toolbar input[type="text"] { min-width: 240px; }
</style>
</head>
<body>
<div id="loadingMsg" class="loading">Loading&hellip;</div>

<div id="app" hidden>
<div class="topbar">
<img src="/assets/legacy-logo.png" alt="Legacy Property Hub">
</div>
<div class="shell">
<aside>
<div class="greeting">
<p class="hi" id="greeting">Hi</p>
<p class="sub" id="unitLabel"></p>
</div>
<nav>
<a href="../Dashboard/">Dashboard</a>
<a href="../Maintenance/">Maintenance Requests</a>
<a class="active" aria-current="page">Payments</a>
<a href="../Documents/">Documents</a>
<div class="divider"></div>
<a href="/legacy/">Sign Out</a>
</nav>
</aside>
<main>
<header class="page-header">
<h1>Payments</h1>
</header>

<div id="apiNotice" class="notice error" hidden></div>
<div id="statusNotice" class="notice good" hidden></div>

<section class="pay-hero">
<div>
<div class="label">Amount due</div>
<div class="amount" id="rentAmount">&mdash;</div>
<div class="due" id="dueSub"></div>
</div>
<div class="pay-actions">
<button class="btn gold" id="payBtn">Pay rent</button>
<div class="sub" id="payStatus"></div>
</div>
</section>

<section>
<h2 style="margin-bottom:12px;">Payment history</h2>
<div class="toolbar">
<input type="text" id="historySearch" placeholder="Search period&hellip;">
<select id="historyStatusFilter">
<option value="">All statuses</option>
<option value="succeeded">Succeeded</option>
<option value="pending">Pending</option>
<option value="failed">Failed</option>
</select>
</div>
<table>
<thead><tr><th>Period</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
<tbody id="historyBody"><tr><td colspan="4">Loading&hellip;</td></tr></tbody>
</table>
</section>
</main>
</div>
<footer class="app-footer">
<span class="brand">Legacy Property Hub</span>
<a class="built-by" href="https://structurecollective.com" target="_blank" rel="noopener">
<img src="/assets/structure-collective-icon.png" alt="" width="16" height="16">
Built by Structure Collective
</a>
</footer>
</div>

<script src="app.js"></script>
</body>
</html>
