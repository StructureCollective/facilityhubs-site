name = "facilityhubs-site-onboarding"
main = "src/index.js"
compatibility_date = "2026-08-28"

# Gives you an instant https://facilityhubs-site-onboarding.<your-subdomain>.workers.dev
# preview URL on every deploy, independent of the facilityhubs.com route below
# (handy while previewing, or if that route fails because the logged-in
# Cloudflare account does not manage the facilityhubs.com zone yet).
workers_dev = true

# This worker only handles the onboarding-inquiry API endpoint -- it
# doesn't serve any static files, so (unlike legacy/) there's no
# [assets] block. Everything else on facilityhubs.com (index.html,
# about.html, get-started.html, gfs/, legacy/) keeps being served
# exactly as it is today; this route just carves out one path for the
# form's POST to land on.
[[routes]]
pattern = "facilityhubs.com/api/onboarding-inquiry*"
zone_name = "facilityhubs.com"

# The real secret (RESEND_API_KEY) is set with `wrangler secret put`,
# never written here. It can be the SAME Resend API key already used
# by legacy/ -- Resend's domain verification for facilityhubs.com
# covers every address at that domain, so support@facilityhubs.com
# works with the same key without any extra Resend setup.
